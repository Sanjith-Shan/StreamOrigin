global:
  scrape_interval: 2s
scrape_configs:
  - job_name: publish-server
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["host.docker.internal:27080"] }]
  - job_name: edge-server
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["host.docker.internal:27081"] }]
